[project]
name = "potato-not-potato"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jim Pelton", email = "jim.pelton.dev@pm.me" }
]
requires-python = ">=3.15"
dependencies = [
    "openai"
]

[tool.uv]
exclude-newer = "3 days"

[project.scripts]
potato = "potato_not_potato:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pyrefly==1.4.1",
    "ruff==0.17.6",
]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
